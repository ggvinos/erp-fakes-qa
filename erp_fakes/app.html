<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ERP Fakes</title>
<style>
:root{--side:#5b0c2c;--side-hover:#701238;--side-on:#8a1a46;--side-fg:#f4e3ea;--side-mut:#c99bad;
--bg:#f4f2f5;--card:#fff;--line:#e4dde7;--fg:#2a2230;--mut:#6f6578;--ac:#8a1538;--ac-h:#730f2e;--field:#fff;
--ok:#1f7a3f;--okbg:#e4f3e8;--info:#1565c0;--infobg:#e3f0fd;--warn:#a65b00;--warnbg:#fff1dc;--err:#b3261e;--errbg:#fde7e5;--neu:#5b5163;--neubg:#ece8f0}
@media(prefers-color-scheme:dark){:root{--bg:#171219;--card:#241b28;--line:#3e3246;--fg:#f1e9f4;--mut:#a99bb0;--ac:#e0709f;--ac-h:#ee86b0;--field:#1c1520;
--ok:#6fd08f;--okbg:#17301f;--info:#7db7f2;--infobg:#142a40;--warn:#f0b35b;--warnbg:#3a2a10;--err:#ff8a80;--errbg:#3d1815;--neu:#c9bdd0;--neubg:#33293a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 Roboto,Inter,system-ui,sans-serif}
.app{display:flex;min-height:100vh}
.side{width:236px;flex:none;background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:20px 20px 14px;font-size:22px;font-weight:700;letter-spacing:.3px;cursor:pointer}.brand span{font-weight:400;opacity:.8}
.side nav{flex:1;overflow:auto;padding:4px 0}
.grp{padding:14px 20px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--side-mut)}
.side a{display:block;padding:9px 20px;color:var(--side-fg);text-decoration:none;border-left:3px solid transparent;font-size:14px}
.side a:hover{background:var(--side-hover)}.side a.on{background:var(--side-on);border-left-color:#ff9db9;font-weight:600}
.side .seg.erps{margin:0 16px 6px;gap:4px;flex-wrap:nowrap}.side .seg.erps button{flex:1;padding:6px 2px;font-size:12px;background:transparent;color:var(--side-fg);border-color:#a8466b}.side .seg.erps button.on{background:#fff;color:var(--ac);border-color:#fff;font-weight:600}
.card .bt{margin-top:12px}
.sidefoot{padding:14px 20px;border-top:1px solid #7a2548;font-size:12px;color:var(--side-mut)}
.main{flex:1;min-width:0}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:22px 28px 6px;flex-wrap:wrap}
.top h1{margin:0;font-size:26px;font-weight:600}.top p{margin:4px 0 0;color:var(--mut)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
main{padding:14px 28px 40px;max-width:1280px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:16px;overflow-x:auto}
td.nw{white-space:nowrap}
.card h2{font-size:16px;margin:0 0 4px}.card .sub{color:var(--mut);margin:0 0 14px}
h3{font-size:13px;margin:18px 0 8px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut)}
button,input,select,textarea{font:inherit}
button{padding:8px 16px;border:1px solid var(--ac);border-radius:6px;background:var(--ac);color:#fff;cursor:pointer;font-weight:500}
button:hover{background:var(--ac-h)}button.sec{background:transparent;color:var(--ac);border-color:var(--line)}button.sec:hover{border-color:var(--ac);background:transparent}
button.perigo{background:transparent;color:var(--err);border-color:var(--err)}button.perigo:hover{background:var(--errbg)}
button.peq{padding:5px 11px;font-size:13px}button:disabled{opacity:.45;cursor:default}
input,select,textarea{padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--field);color:var(--fg);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:-1px;border-color:var(--ac)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mut);font-weight:500}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.fg .full{grid-column:1/-1}
@media(max-width:700px){.fg{grid-template-columns:1fr}}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}.bar .grow{flex:1;min-width:200px}.bar label.f{min-width:150px}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:10px 10px;font-size:12px;font-weight:600;color:var(--mut);border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13px}
tr.lin{cursor:pointer}tr.lin:hover td{background:var(--bg)}tr.sel td{background:var(--infobg)}
.vazio{text-align:center;color:var(--mut);padding:36px 0}
.slots{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.slot{padding:4px 10px;font-size:12px}.slot.livre{border-color:var(--ok,#2a9d5c)}.slot.ocupado{opacity:.6}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--neubg);color:var(--neu);white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.info{background:var(--infobg);color:var(--info)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.err{background:var(--errbg);color:var(--err)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.seg button{background:transparent;color:var(--fg);border-color:var(--line);padding:6px 13px;font-weight:400}
.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:500}
.alert{border-radius:6px;padding:11px 14px;margin-bottom:10px;border-left:4px solid}.alert b{display:block}
.alert.ok{background:var(--okbg);border-color:var(--ok)}.alert.alerta{background:var(--warnbg);border-color:var(--warn)}.alert.erro{background:var(--errbg);border-color:var(--err)}.alert.info{background:var(--infobg);border-color:var(--info)}
.copia{display:flex;gap:8px;align-items:flex-end;margin-bottom:12px}.copia label.f{flex:1}.copia input{font-family:ui-monospace,monospace;font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
.mut{color:var(--mut)}.peq{font-size:13px}
pre{background:var(--bg);border:1px solid var(--line);padding:10px;border-radius:6px;overflow:auto;font-size:12px;max-height:300px;margin:6px 0;white-space:pre-wrap;word-break:break-word}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:13px}.kv dt{color:var(--mut)}.kv dd{margin:0}
.bt{display:flex;gap:6px;flex-wrap:wrap}.linha{display:flex;gap:8px;align-items:flex-end;margin-bottom:10px;flex-wrap:wrap}.linha label.f{flex:1;min-width:140px}
svg{width:100%;height:auto}svg text{fill:var(--fg);font:13px Roboto,system-ui}svg .box{fill:var(--bg);stroke:var(--ac);stroke-width:1.4}svg .edge{stroke:var(--mut);stroke-width:1.2}svg .lab{fill:var(--mut);font-size:11px}
#scrim{position:fixed;inset:0;background:rgba(20,10,24,.45);display:none;z-index:20}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100vw);background:var(--card);z-index:21;display:none;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.25)}
#drawer.largo{width:min(860px,100vw)}
.dr-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dr-head h2{margin:0;font-size:18px}.dr-head p{margin:3px 0 0;color:var(--mut);font-size:13px}
.dr-body{flex:1;overflow:auto;padding:18px 22px}.dr-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
#aviso{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;max-width:440px;padding:11px 18px;border-radius:6px;background:var(--fg);color:var(--bg);display:none;z-index:40}
#aviso.erro{background:var(--err);color:#fff}
details summary{cursor:pointer;color:var(--ac);font-weight:500;margin:8px 0}
@media(max-width:860px){.app{flex-direction:column}.side{width:100%;height:auto;position:static}.side nav{display:flex;flex-wrap:wrap}.grp{display:none}.sidefoot{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><div class="brand" onclick="location.hash='#inicio'">ERP <span>Fakes</span></div><div id="erps"></div><nav id="nav"></nav><div class="sidefoot" id="sf">carregando</div></aside>
<div class="main"><div class="top"><div><h1 id="ttl"></h1><p id="sub"></p></div><div class="acts" id="acts"></div></div><main id="view"></main></div>
</div>
<div id="scrim"></div><aside id="drawer"></aside><div id="aviso"></div>
<script>
const $=(s,r=document)=>r.querySelector(s);
function h(tag,props,...kids){const e=document.createElement(tag);for(const [k,v] of Object.entries(props||{})){if(v==null||v===false)continue;
 if(k==='class')e.className=v;else if(k.startsWith('on'))e[k]=v;else if(k==='value')e.value=v;else e.setAttribute(k,v===true?'':v)}
 for(const c of kids.flat(2)){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}return e}
let TOKEN='',STATUS=null,TIMER=null,AV=null,DR=null;
const ERPS=[['feegow','Feegow'],['netpacs','NetPacs'],['tasy','Tasy']];
let ERP='feegow';try{const e=localStorage.getItem('erp');if(ERPS.some(x=>x[0]===e))ERP=e}catch(e){}
const nomeErp=()=>ERPS.find(x=>x[0]===ERP)[1];
async function api(path,opts={}){const r=await fetch(path,{method:opts.method||'GET',headers:{'x-access-token':TOKEN,'x-erp':ERP,'content-type':'application/json'},body:opts.body?JSON.stringify(opts.body):undefined});
 let j=null;try{j=await r.json()}catch(e){}if(!r.ok){const m=j&&(j.erro||j.content||j.message)||r.statusText;const er=new Error(typeof m==='string'?m:JSON.stringify(m));er.status=r.status;throw er}return j}
function aviso(msg,erro){const a=$('#aviso');a.textContent=msg;a.className=erro?'erro':'';a.style.display='block';clearTimeout(AV);AV=setTimeout(()=>a.style.display='none',erro?7000:3200)}
async function tente(fn){try{return await fn()}catch(e){aviso(e.message,true)}}
const hora=t=>new Date(t*1000).toLocaleTimeString('pt-BR');
const atras=t=>{if(!t)return 'nunca';const s=Math.round(Date.now()/1000-t);return s<60?s+' s':s<3600?Math.round(s/60)+' min':Math.round(s/3600)+' h'};
function copiar(txt,btn){navigator.clipboard.writeText(txt);const o=btn.textContent;btn.textContent='Copiado';setTimeout(()=>btn.textContent=o,1200)}
const chip=(t,tipo)=>h('span',{class:'chip'+(tipo?' '+tipo:'')},t);
const STCOR={1:'info',2:'warn',3:'ok',4:'warn',5:'warn',6:'warn',7:'ok',11:'err',15:'err',16:''};
const statusChip=(id,nome)=>chip(nome||String(id),STCOR[id]);
function campo(rotulo,el,cls){return h('label',{class:'f'+(cls?' '+cls:'')},rotulo,el)}
function vazio(t){return h('div',{class:'vazio'},t)}
function cabecalho(titulo,sub,...acoes){$('#ttl').textContent=titulo;$('#sub').textContent=sub||'';$('#acts').replaceChildren(...acoes.flat().filter(Boolean))}
function abreDrawer(titulo,sub,corpo,rodape,largo){const d=$('#drawer');d.className=largo?'largo':'';d.style.display='flex';$('#scrim').style.display='block';
 d.replaceChildren(h('div',{class:'dr-head'},h('div',{},h('h2',{},titulo),sub?h('p',{},sub):null),h('button',{class:'sec peq',onclick:fechaDrawer},'Fechar')),h('div',{class:'dr-body'},corpo),rodape?h('div',{class:'dr-foot'},rodape):null)}
function fechaDrawer(){$('#drawer').style.display='none';$('#scrim').style.display='none';DR=null}
$('#scrim').onclick=fechaDrawer;document.addEventListener('keydown',e=>{if(e.key==='Escape')fechaDrawer()});
function parseTabela(txt){const ls=txt.split('\n').map(l=>l.replace(/\r$/,'')).filter(l=>l.trim()&&!/^\+[-+]+\+$/.test(l.trim()));if(!ls.length)return [];
 const caixa=ls[0].trim().startsWith('|');const rows=caixa?ls.filter(l=>l.trim().startsWith('|')).map(l=>l.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim())):ls.map(l=>l.split('\t').map(c=>c.trim()));
 const cab=rows[0].map(c=>c.toLowerCase());return rows.slice(1).filter(r=>r.length===cab.length).map(r=>Object.fromEntries(cab.map((c,i)=>[c,r[i]])))}
function valorNum(t){if(t==null||t==='')return null;if(typeof t==='number')return t;let x=String(t).replace(/[^0-9,.\-]/g,'');if(!x)return null;const vc=x.lastIndexOf(','),vp=x.lastIndexOf('.');
 if(vc>=0&&vp>=0)x=vc>vp?x.replace(/\./g,'').replace(',','.'):x.replace(/,/g,'');else if(vc>=0)x=x.replace(',','.');else if(/^-?\d{1,3}(\.\d{3})+$/.test(x))x=x.replace(/\./g,'');
 const n=parseFloat(x);return isNaN(n)||n<=0||n>99999.99?null:Math.round(n*100)/100}
const GRUPOS=[['Conexão',[['inicio','Início']]],['Dados e simulação',[['dados','Dados do ERP'],['agenda','Agendamentos'],['horarios','Horários'],['volume','Volume e importação'],['roteiros','Roteiros']]],['Diagnóstico',[['chamadas','Chamadas'],['falhas','Falhas simuladas'],['docs','Documentação']]]];
const VIEWS={};
function montaErps(){document.title=nomeErp()+' | ERP Fakes';
 $('#erps').replaceChildren(h('div',{class:'grp'},'ERP simulado'),h('div',{class:'seg erps'},...ERPS.map(([k,t])=>h('button',{class:k===ERP?'on':'',onclick:()=>trocaErp(k)},t))))}
function trocaErp(k){if(k===ERP)return;ERP=k;try{localStorage.setItem('erp',k)}catch(e){}
 if(typeof AG!=='undefined'){AG.listas=null;AG.conf={};AG.q='';AG.cenario='';AG.dia='';AG.ini=0;AG.sel=null}if(typeof DT!=='undefined'){DT.tipo='profissionais';DT.q='';DT.ini=0}if(typeof HR!=='undefined'){HR.unid='';HR.prof=''}
 montaErps();rota()}
function montaNav(atual){$('#nav').replaceChildren(...GRUPOS.flatMap(([g,its])=>[h('div',{class:'grp'},g),...its.filter(([k])=>k!=='roteiros'||STATUS.perfil.roteiros).map(([k,t])=>h('a',{href:'#'+k,class:k===atual?'on':''},t))]))}
async function status(){try{STATUS=await (await fetch('/_local/status')).json();TOKEN=STATUS.token;const st=STATUS.tunel.status;
 const lv=$('#rt-live');if(lv){lv.className='alert '+(STATUS.cliente.em_andamento?'info':'ok');lv.replaceChildren(h('b',{},STATUS.cliente.em_andamento?'Carga [[do_cliente]] em andamento':'[[O_cliente]] está parada'),h('span',{},STATUS.cliente.em_andamento?'Espere terminar antes de rodar a consulta no banco.':'Pode rodar a consulta no banco.'))}
 $('#sf').replaceChildren(h('div',{},'Túnel: ',chip(st,st==='conectado'?'ok':st==='iniciando'||st==='desligado'?'':'err')),h('div',{style:'margin-top:6px'},'Porta local '+STATUS.porta))}catch(e){$('#sf').textContent='sem resposta do programa'}}
function rota(){montaErps();const k=(location.hash||'#inicio').slice(1);const f=VIEWS[k]||VIEWS.inicio;clearInterval(TIMER);TIMER=null;fechaDrawer();montaNav(VIEWS[k]?k:'inicio');window.scrollTo(0,0);f()}

/* ---------- Início ---------- */
VIEWS.inicio=async()=>{
 cabecalho('Conexão com [[o_cliente]]','Cole a URL e a chave na integração da conta de teste. Esta tela avisa quando algo ficar desatualizado.');
 $('#view').replaceChildren(h('div',{id:'al'}),h('div',{class:'grid2'},
  h('div',{class:'card'},h('h2',{},'Configuração da conta'),h('p',{class:'sub',id:'cxs'},''),h('div',{id:'cx'}),h('div',{id:'cxa'}),
   h('ol',{class:'mut'},h('li',{},'Cole a URL e o token e salve.'),h('li',{},'[[instrucao_carga]]'),h('li',{},'Acompanhe em Chamadas o que [[o_cliente]] pediu.')),
   h('button',{class:'sec',onclick:async()=>{await fetch('/_local/ack');tela()}},'Já atualizei na conta')),
  h('div',{class:'card'},h('h2',{},'Atividade [[do_cliente]]'),h('p',{id:'ac',class:'sub'}),h('div',{id:'ca'}),h('p',{style:'margin:12px 0 0'},h('a',{href:'#chamadas',style:'color:var(--ac)'},'Ver todas as chamadas')))),
  h('p',{id:'pe',class:'mut peq'}));
 async function tela(){await status();const s=STATUS;
  $('#al').replaceChildren(...s.alertas.map(a=>h('div',{class:'alert '+a.nivel},h('b',{},a.titulo),h('span',{},a.detalhe))));
  const cp=(r,val)=>h('div',{class:'copia'},campo(r,h('input',{value:val,readonly:true})),h('button',{class:'sec',onclick:e=>copiar(val,e.target)},'Copiar'));
  const conta=(s.erps||{})[ERP];$('#cxs').textContent='[[caminho_conta]] '+nomeErp()+'.';
  if(conta){$('#cx').replaceChildren(...conta.campos.map(([r,v])=>cp(r,v||'aguardando túnel')));$('#cxa').replaceChildren(conta.aviso?h('p',{class:'mut peq'},conta.aviso):'')}
  const j=await tente(()=>api('/_admin/journal?limite=8&origem=tunel&erp='+ERP));
  $('#ac').textContent=s.cliente.ultima_chamada?`Última chamada há ${atras(s.cliente.ultima_chamada)}. ${s.cliente.chamadas_5min} chamadas nos últimos 5 minutos.`:'Nenhuma chamada [[do_cliente]] pelo túnel ainda.';
  $('#ca').replaceChildren(j&&j.itens.length?h('table',{},...j.itens.map(e=>h('tr',{},h('td',{},hora(e.t)),h('td',{},e.metodo),h('td',{},e.caminho),h('td',{},chip(String(e.status),e.status>=400?'err':'ok'))))):vazio('Sem chamadas ainda'));
  $('#pe').textContent=(s.tunel.desde?`Endereço atual criado às ${hora(s.tunel.desde)}. `:'')+`Porta local ${s.porta}.`}
 await tela();TIMER=setInterval(tela,4000)};

/* ---------- Dados ---------- */
const NOMES={unidades:'Unidades',especialidades:'Especialidades',convenios:'Convênios',planos:'Planos',tabelas:'Tabelas particulares',procedimentos:'Procedimentos',profissionais:'Profissionais',pacientes:'Pacientes',bloqueios:'Bloqueios de agenda'};
const SING={unidades:'Unidade',especialidades:'Especialidade',convenios:'Convênio',planos:'Plano',tabelas:'Tabela particular',procedimentos:'Procedimento',profissionais:'Profissional',pacientes:'Paciente',bloqueios:'Bloqueio de agenda'};
const POS={tipos:[20,20],unidades:[320,20],especialidades:[620,20],procedimentos:[20,170],agendamentos:[320,170],profissionais:[620,170],bloqueios:[830,170],pacientes:[20,320],tabelas:[320,320],convenios:[620,320],planos:[830,320],ocultos:[620,430]};
let DT={aba:'dados',tipo:'profissionais',q:'',ini:0};
VIEWS.dados=async()=>{
 const abas=h('div',{class:'seg'},...[['dados','Editar dados'],['mapa','Mapa e relacionamentos']].map(([k,t])=>h('button',{class:DT.aba===k?'on':'',onclick:()=>{DT.aba=k;VIEWS.dados()}},t)));
 $('#view').replaceChildren(abas,h('div',{id:'dz'}));
 if(DT.aba==='mapa'){cabecalho('Dados do ERP','Como as entidades do '+nomeErp()+' se relacionam e onde cada uma cai [[no_cliente]].');return mapa()}
 cabecalho('Dados do ERP','O que você muda aqui é o que [[o_cliente]] recebe na próxima carga.',h('button',{onclick:novoRegistro},'Novo registro'));
 await tabelaDados()};
async function tabelaDados(){const d=await tente(()=>api(`/_admin/entities/${DT.tipo}?q=${encodeURIComponent(DT.q)}&limite=15&inicio=${DT.ini}`));if(!d)return;
 const cols=d.linhas[0]?Object.keys(d.linhas[0]):[d.id];
 const tipos=h('div',{class:'seg'},...Object.entries(NOMES).map(([k,t])=>h('button',{class:DT.tipo===k?'on':'',onclick:()=>{DT.tipo=k;DT.q='';DT.ini=0;tabelaDados()}},t)));
 const busca=h('input',{placeholder:'Buscar em '+NOMES[DT.tipo].toLowerCase(),value:DT.q,onkeydown:e=>{if(e.key==='Enter'){DT.q=e.target.value;DT.ini=0;tabelaDados()}}});
 const bonito=c=>c.replace(/_/g,' ');
 $('#dz').replaceChildren(h('div',{class:'card'},h('p',{class:'sub'},'O id de cada registro é o ID externo: [[o_cliente]] guarda como ID externo e dá o seu próprio ID interno. Clique em uma linha para editar.'),tipos,
  h('div',{class:'bar'},campo('Buscar',busca,'grow')),
  d.linhas.length?h('table',{},h('tr',{},...cols.map(c=>h('th',{},bonito(c)))),...d.linhas.map(l=>h('tr',{class:'lin',onclick:()=>editaRegistro(d,l)},...cols.map(c=>h('td',{},Array.isArray(l[c])?l[c].join(', '):typeof l[c]==='boolean'?(l[c]?'Sim':'Não'):String(l[c]??'')))))):vazio('Nenhum registro encontrado'),
  h('div',{class:'bar',style:'margin:12px 0 0'},h('button',{class:'sec peq',disabled:DT.ini===0,onclick:()=>{DT.ini=Math.max(0,DT.ini-15);tabelaDados()}},'Anterior'),h('span',{class:'mut'},`${d.total?DT.ini+1:0} a ${Math.min(DT.ini+15,d.total)} de ${d.total}`),h('button',{class:'sec peq',disabled:DT.ini+15>=d.total,onclick:()=>{DT.ini+=15;tabelaDados()}},'Próxima'))))}
