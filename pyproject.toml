[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "erp-fakes-qa"
version = "0.1.0"
description = "ERPs de saúde simulados (Feegow, NetPacs, Tasy) para QA de integrações e testes automatizados"
license = { text = "MIT" }
authors = [{ name = "Vinicios Ferreira" }]
keywords = ["qa", "testing", "mock", "erp", "integration"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/ggvinos/erp-fakes-qa"

[project.scripts]
erp-fakes = "erp_fakes.launcher:main"

[tool.setuptools]
packages = ["erp_fakes", "erp_fakes.perfis"]

[tool.setuptools.package-data]
erp_fakes = ["*.html"]
